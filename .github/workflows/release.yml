name: Release packages and assets

on:
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      release_id:
        required: true
        type: string
      release_body:
        required: true
        type: string
      notes_digest:
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write
jobs:
  verify:
    name: Verify the gem before anything is pushed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # `write`, not `read`, and the gate below is the whole reason: a DRAFT
      # release is invisible to a caller without push access, so under
      # `contents: read` the listing comes back empty and the gate reports
      # "no release" for a draft that is sitting right there with notes in
      # it. See markup-carve/carve-wasm#80.
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify approval and checked tag before publishing
        working-directory: ${{ github.workspace }}
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.source_sha }}
          RELEASE_NOTES_DIGEST: ${{ inputs.notes_digest }}
        run: python .github/scripts/release-lane.py permit
      - name: Expose the candidate tag locally
        if: ${{ !inputs.publish }}
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          git tag "$CANDIDATE_TAG" "${{ inputs.source_sha }}"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: The version surfaces agree
        run: |
          gem install rouge --no-document
          version="$(ruby -Ilib -e 'require "rouge-carve"; print RougeCarve::VERSION')"
          if [ "${{ 'push' }}" != "workflow_dispatch" ]; then
            [ "$version" = "$LANE_TAG" ] \
              || { echo "::error::VERSION is $version, tag is $LANE_TAG"; exit 1; }
          fi
          grep -qE "^## \[?${version//./\\.}\]? - " CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no dated section for $version"; exit 1; }

      # GATE, before anything is published. The notes are not the workflow's to
      # write - a CHANGELOG entry is deliberately one or two lines for a
      # contributor, which makes poor release notes for a reader deciding
      # whether to upgrade - so a human writes the draft first and this refuses
      # to publish without one.
      #
      # Found by listing rather than `gh release view <tag>`: a draft's tag is
      # not a git ref, so addressing one by tag can match nothing, change
      # nothing and still exit 0.
      - name: A release draft for this tag exists and has notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$LANE_TAG\")] | first")"
          if [ -z "$release" ]; then
            echo "::error::no release for $LANE_TAG. Write the notes first:" \
                 "gh release create $LANE_TAG --draft --notes-file NOTES.md"
            echo "::error::if a draft DOES exist, this job could not see it -" \
                 "check that the job still declares contents: write"
            exit 1
          fi
          body="$(printf '%s' "$release" | jq -r '.body // ""' | tr -d '[:space:]')"
          [ -n "$body" ] \
            || { echo "::error::the release for $LANE_TAG has no notes"; exit 1; }
          printf '%s' "$release" | jq -r '"draft=\(.draft) tag=\(.tag_name)"'

        if: ${{ inputs.publish }}
      - name: Spec
        run: |
          gem install rspec --no-document
          rspec -I lib -I spec

      - name: Corpus gates
        run: |
          git clone --depth 1 https://github.com/markup-carve/carve.git carve-spec
          ruby script/corpus_check.rb carve-spec
          ruby script/preservation_check.rb carve-spec
          ruby script/parity_check.rb

      - name: The gem carries the lexer, its entry and the demo
        run: |
          gem build rouge-carve.gemspec
          listing="$(ruby -rrubygems/package -e 'puts Gem::Package.new(Dir["*.gem"].first).spec.files')"
          for file in lib/rouge-carve.rb lib/rouge/lexers/carve.rb lib/rouge/demos/carve; do
            printf '%s\n' "$listing" | grep -qx "$file" \
              || { echo "::error::the gem is missing $file"; exit 1; }
          done

      - name: The built gem registers the lexer when required
        run: |
          gem install --local ./rouge-carve-*.gem --no-document
          ruby -e 'require "rouge-carve"; abort "not registered" unless Rouge::Lexer.find("carve")'

      - uses: actions/upload-artifact@v4
        with:
          name: verified-gem-${{ inputs.publish && 'publish' || 'check' }}
          path: rouge-carve-*.gem
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Push the verified gem to RubyGems
    # A separate job that needs `verify`, so the push cannot start while a gate
    # is failing and has nothing to push but the artifact that job produced.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    # `id-token: write` is required for the OIDC exchange and is never granted
    # implicitly.
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4

        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify approval and checked tag before publishing
        working-directory: ${{ github.workspace }}
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.source_sha }}
          RELEASE_NOTES_DIGEST: ${{ inputs.notes_digest }}
        run: python .github/scripts/release-lane.py permit
      - name: Expose the candidate tag locally
        if: ${{ !inputs.publish }}
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          git tag "$CANDIDATE_TAG" "${{ inputs.source_sha }}"
      - uses: actions/download-artifact@v4
        with:
          name: verified-gem-${{ inputs.publish && 'publish' || 'check' }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      # Trusted publishing, for the reason carve-rb uses it: the account requires
      # MFA on API pushes, so a long-lived key cannot publish unattended - it
      # asks for an OTP nobody is there to type. GitHub mints a short-lived
      # token naming this repository and workflow, RubyGems exchanges it for a
      # credential valid for minutes, and no OTP is involved.
      - name: Exchange the OIDC token for a RubyGems credential
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

        if: ${{ inputs.publish }}
      - name: Push gem to RubyGems
        run: |
          if [ "$LANE_PUBLISH" = true ]; then
            gem push rouge-carve-*.gem
          else
            ls -l ./*.gem
          fi


      # Publish the draft a human wrote. Addressed by ID with tag_name sent,
      # because omitting tag_name on a draft clears the tag to `untagged-...`.
        shell: bash
env:
  LANE_TAG: ${{ inputs.tag }}
  LANE_REF: ${{ format('refs/tags/{0}', inputs.tag) }}
  LANE_REF_TYPE: tag
  LANE_PUBLISH: ${{ inputs.publish }}
