name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every job below carries a timeout-minutes bound, so a hung step fails in
# minutes instead of running to GitHub's 360-minute default.
jobs:
  spec:
    name: "Ruby ${{ matrix.ruby }} / Rouge ${{ matrix.rouge }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The floor the gemspec claims (3.30), the version GitLab pins (4) and
        # the current release - a lexer that only works on one of them is not
        # portable.
        ruby: ['2.7', '3.2', '3.4']
        rouge: ['~> 3.30', '~> 4.0', '~> 5.0']
        exclude:
          # Rouge 5 requires Ruby >= 3.0, so this pair cannot be installed at
          # all. Ruby 2.7 is still covered, against Rouge 4.
          - ruby: '2.7'
            rouge: '~> 5.0'
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install
        run: |
          gem install rspec rake --no-document
          gem install rouge --no-document --version "${{ matrix.rouge }}"
      - name: Spec
        run: rspec -I lib -I spec
