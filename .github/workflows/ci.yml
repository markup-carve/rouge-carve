name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    name: "Ruby ${{ matrix.ruby }} / Rouge ${{ matrix.rouge }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the gemspec claims, the current release, and the version
        # GitLab pins - a lexer that only works on one of them is not portable.
        ruby: ['2.7', '3.2', '3.4']
        rouge: ['~> 4.0', '~> 5.0']
        exclude:
          # Rouge 5 requires Ruby >= 3.0, so this pair cannot be installed at
          # all. Ruby 2.7 is still covered, against Rouge 4.
          - ruby: '2.7'
            rouge: '~> 5.0'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install
        run: |
          gem install rspec rake --no-document
          gem install rouge --no-document --version "${{ matrix.rouge }}"
      - name: Spec
        run: rspec -I lib -I spec

  corpus:
    name: Corpus gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install
        run: gem install rouge --no-document
      - name: Check out the corpus
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve
          path: carve-spec
      - name: No error token
        run: ruby script/corpus_check.rb carve-spec

      - name: Every document round-trips
        run: ruby script/preservation_check.rb carve-spec

      - name: Construct parity with the sibling grammars
        run: ruby script/parity_check.rb
